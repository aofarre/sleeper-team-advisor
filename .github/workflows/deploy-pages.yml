name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Tuesday 14:00 UTC. GitHub Actions schedules in UTC; this is the weekly public-data refresh.
    - cron: "0 14 * * 2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run advisor logic tests
        run: node --test tests/sleeper-advisor.test.js
      - name: Build Tuesday public Sleeper baseline
        run: node scripts/refresh-sleeper-snapshot.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
